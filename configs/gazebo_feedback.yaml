# RGB attention yaw feedback with learned BC/PPO residual; development candidate.
gazebo:
  backend: gazebo_harmonic_px4_sitl
  world: aerointercept_park
  target:
    spawn_position_world:
    - 0.0
    - 10.0
    - 0.0
    origin_ned:
    - 10.0
    - 0.0
    - 0.0
    initial_model_separation_m: 10.0
    scenario_controller: bounded_cooperative_v1
  scene:
    preset: realistic_park
    local_pbr_surface: true
    official_fuel_vegetation: true
    first_launch_requires_network: true
  bridge:
    socket: /tmp/aerointercept_gazebo/bridge.sock
    timeout_s: 10.0
    startup_timeout_s: 45.0
  camera:
    source: Gazebo OakD-Lite IMX214 via ros_gz_bridge
    source_width: 1920
    source_height: 1080
    source_topic: /camera/image
    transform: full_frame_letterbox_v1
    horizontal_fov: 1.204
    vertical_fov: 0.737596
    color_order: RGB
    mount_yaw_offset_rad: 0.0
    output_width: 640
    output_height: 640
  action:
    protocol: body_forward_right_down_yaw_rate
    velocity_max: 8.0
    yaw_rate_max: 1.0
  expert:
    controller: cooperative_rendezvous_v1
    offset_ned:
    - -0.46
    - 0.0
    - 0.14
    position_gain: 1.0
    relative_velocity_gain: 0.6
    target_acceleration_feedforward_seconds: 0.4
    minimum_horizontal_separation_m: 0.45
    close_approach_gain: 0.3
    braking_lookahead_seconds: 0.8
    maximum_relative_speed: 2.0
    yaw_gain: 2.0
    action_smoothing: 0.05
  task:
    reset_position_ned:
    - 0.0
    - 0.0
    - -6.0
    reset_yaw: 0.0
    look_at_target: true
    reset_yaw_tolerance_rad: 0.15
    reset_timeout_s: 90.0
    reset_tolerance_m: 0.5
    reset_speed_tolerance: 0.5
    reset_target_distance_m: 10.0
    reset_target_distance_tolerance_m: 0.2
    target_minimum_altitude: 4.0
    episode_max_steps: 600
    hit_radius: 0.5
    task_version: noncontact_rendezvous_v1
    center_reference: gazebo_base_link_center_enu_to_ned_v2
    target_bounding_radius_m: 0.4
    rendezvous_max_relative_speed_mps: 0.5
    rendezvous_hold_seconds: 0.3
    rendezvous_settle_seconds: 1.0
    require_contact_monitor: true
    lost_steps: 30
    ground_height: 0.25
    scene_boundary: 35.0
    maximum_altitude: 20.0
  rewards:
    vertical_clearance_weight: 1.0
    vertical_clearance_m: 0.14
    vertical_clearance_activation_m: 2.0
    close: 1.0
    hit: 50.0
    time: -0.01
    fov_center: -0.1
    lost: -0.2
    smooth: -0.05
    ground: -20.0
    invalid: -30.0
    out_of_bounds: -20.0
    timeout: -10.0
    contact: -100.0
  runtime:
    ros_setup: /opt/ros/humble/setup.bash
    ros_workspace: /home/verser/ros2_ws/install/setup.bash
    px4_root: /home/verser/PX4-Autopilot
    target_controller: /home/verser/ros2_ws/build/uav_target_sim/uav_target_sim
end_to_end:
  render:
    source: Gazebo OakD-Lite IMX214 / full-frame letterbox
    source_image_width: 1920
    source_image_height: 1080
    transform: full_frame_letterbox_v1
    image_width: 640
    image_height: 640
    channel_order: RGB
    history_frames: 2
    storage_dtype: uint8
    normalization: float32/255 then ImageNet mean/std
  model:
    encoder_type: resnet18_multiscale_v1
    pretrained_weights: IMAGENET1K_V1
    encoder_multiscale_channels: 96
    encoder_chunk_size: 4
    init_log_std: -3.5
    self_state_dim: 6
    self_velocity_scale: 8.0
    self_angular_velocity_scale: 2.0
    spatial_coordinates: true
    visual_yaw_gain: 2.0
    camera_horizontal_fov: 1.204
  bc:
    episodes: 48
    sequence_length: 16
    batch_size: 2
    epochs: 20
    learning_rate: 0.0003
    backbone_learning_rate: 1.0e-05
    backbone_freeze_epochs: 3
    keep_backbone_batch_norm_eval: true
    val_fraction: 0.1
    num_workers: 0
    cache_episodes: 48
  ppo:
    num_envs: 1
    rollout_steps: 16
    total_steps: 512
    num_minibatches: 4
    backbone_learning_rate: 5.0e-06
    log_std_min: -5.0
    log_std_max: -3.0
    entropy_coef: 0.0
  auxiliary:
    spatial_coef: 0.05
    action_axis_weights: [1.0, 1.0, 16.0, 4.0]
